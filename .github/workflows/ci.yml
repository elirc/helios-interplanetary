name: Verify Helios
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: helios
          POSTGRES_PASSWORD: helios_ci_only
          POSTGRES_DB: helios_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helios -d helios_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://helios:helios_ci_only@127.0.0.1:5432/helios
      TEST_DATABASE_URL: postgresql://helios:helios_ci_only@127.0.0.1:5432/helios_test
      DEMO_MODE: "true"
      APP_ORIGIN: http://127.0.0.1:3001
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: artifacts/
